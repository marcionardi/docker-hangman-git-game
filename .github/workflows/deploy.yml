name: 🚀 Deploy Git Game to Azure

# Quando o workflow será executado
on:
  push:
    branches: [ main ] # a cada vez que houver um push na branch main, o workflow será executado
  workflow_dispatch:

# Variáveis globais do workflow
env:
  REGISTRY_NAME: gitgame    

# Jobs do workflow
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # PASSO 1: Checkout do código  
    - name: Checkout code
      uses: actions/checkout@v4
    
    # PASSO 2: Login no Azure
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
      
    # PASSO 3: Instalar o Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
     
    # PASSO 4: Inicializar e preparar o Terraform
    - name: 🔧 Terraform Init
      run: |
        cd terraform
        export ARM_CLIENT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
        export ARM_CLIENT_SECRET="${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
        export ARM_TENANT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"
        export ARM_SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"
        
        terraform init

    # PASSO 5: Planejar a Infraestrutura com Terraform
    - name: Terraform Plan
      run:  |
        cd terraform
        export ARM_CLIENT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
        export ARM_CLIENT_SECRET="${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
        export ARM_TENANT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"
        export ARM_SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"

        terraform plan -target=azurerm_resource_group.gitgame -target=azurerm_container_registry.gitgame -target=random_string.suffix

    # PASSO 6: Aplicar a Infraestrutura básica
    - name: Terraform Apply
      run:  |
        cd terraform
        export ARM_CLIENT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
        export ARM_CLIENT_SECRET="${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
        export ARM_TENANT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"
        export ARM_SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"

        terraform apply -auto-approve -target=azurerm_resource_group.gitgame -target=azurerm_container_registry.gitgame -target=random_string.suffix

    # 🐳 PASSO 7: Build das imagens
    - name: 🐳 Build and Push Images
      run: |
        # Configurar Terraform
        export ARM_CLIENT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
        export ARM_CLIENT_SECRET="${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
        export ARM_TENANT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"
        export ARM_SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"
        
        # Buscar info do registry
        cd terraform
        
        echo "🔍 Debugging Terraform outputs..."
        terraform output
        
        ACR_SERVER=$(terraform output -raw acr_login_server)
        ACR_USERNAME=$(terraform output -raw acr_admin_username)
        ACR_PASSWORD=$(terraform output -raw acr_admin_password)
        RANDOM_SUFFIX=$(terraform output -raw random_suffix)
        
        # Validar que as variáveis foram definidas
        if [ -z "$ACR_SERVER" ] || [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
          echo "❌ Error: Missing Terraform outputs!"
          echo "ACR_SERVER: $ACR_SERVER"
          echo "ACR_USERNAME: $ACR_USERNAME"
          echo "RANDOM_SUFFIX: $RANDOM_SUFFIX"
          exit 1
        fi
        
        cd ..
        
        # Login no registry
        echo $ACR_PASSWORD | docker login -u $ACR_USERNAME --password-stdin $ACR_SERVER
        
        # Build e push das imagens
        docker build -t $ACR_SERVER/gitgame-db:latest ./db
        docker push $ACR_SERVER/gitgame-db:latest
        
        docker build -t $ACR_SERVER/gitgame-backend:latest ./backend
        docker push $ACR_SERVER/gitgame-backend:latest
        
        # Frontend com URL da API
        docker build \
          --build-arg VITE_API_URL="http://gitgame-${RANDOM_SUFFIX}.eastus.azurecontainer.io:8000" \
          -t $ACR_SERVER/gitgame-frontend:latest ./frontend
        docker push $ACR_SERVER/gitgame-frontend:latest

    # 🚀 PASSO 8: Deploy dos containers
    - name: 🏗️ Deploy Containers
      run: |
        cd terraform
        export ARM_CLIENT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
        export ARM_CLIENT_SECRET="${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
        export ARM_TENANT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"
        export ARM_SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"
        
        # Força recriação dos containers para usar imagens atualizadas
        if terraform state show azurerm_container_group.gitgame >/dev/null 2>&1; then
          terraform taint azurerm_container_group.gitgame
        fi
        
        terraform apply -auto-approve
        
    # ✅ PASSO 9: URLs da aplicação
    - name: 🎮 Show Application URLs
      run: |
        cd terraform
        export ARM_CLIENT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}"
        export ARM_CLIENT_SECRET="${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}"
        export ARM_TENANT_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}"
        export ARM_SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"
        
        echo "🎮 Git Game URLs:"
        echo "🌐 Frontend: $(terraform output -raw application_url)"
        echo "🔗 API: $(terraform output -raw api_url)"
        echo ""
        echo "🎉 Deploy concluído! Aguarde 2-3 minutos para ficar disponível."        